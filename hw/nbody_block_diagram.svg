<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill:#f4f6fb; stroke:#334; stroke-width:1.5; }
    .core { fill:#eaf2ff; stroke:#2a5bd7; stroke-width:1.5; }
    .unit { fill:#fff7e6; stroke:#b8860b; stroke-width:1.2; }
    .math { fill:#f3ffe6; stroke:#5c8a1f; stroke-width:1.2; }
    .lbl { font-size:14px; fill:#111; }
    .sub { font-size:11px; fill:#444; }
    .title { font-size:16px; font-weight:bold; fill:#111; }
    .sub2 { font-size:10px; fill:#666; }
    line, path.wire { stroke:#333; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
  </style>

  <text x="20" y="28" class="title">N-Body Pairwise Gravity Accelerator - Block Diagram</text>
  <text x="20" y="46" class="sub2">IEEE-754 float64 datapath - all math units shared/time-multiplexed across 10 pairs x 5 bodies x N iterations</text>

  <!-- Host CPU -->
  <rect x="20" y="70" width="180" height="90" rx="6" class="box"/>
  <text x="110" y="105" class="lbl" text-anchor="middle">Host CPU</text>
  <text x="110" y="125" class="sub" text-anchor="middle">(Python / pyperformance)</text>
  <text x="110" y="142" class="sub" text-anchor="middle">nbody driver</text>

  <!-- MMIO bus -->
  <rect x="260" y="70" width="140" height="90" rx="6" class="box"/>
  <text x="330" y="105" class="lbl" text-anchor="middle">MMIO Bus</text>
  <text x="330" y="125" class="sub" text-anchor="middle">(AXI-Lite /</text>
  <text x="330" y="140" class="sub" text-anchor="middle">Avalon-MM wrapper)</text>
  <text x="330" y="153" class="sub2" text-anchor="middle">64-bit data, 9-bit addr</text>

  <line x1="200" y1="115" x2="260" y2="115" class="wire"/>
  <line x1="260" y1="130" x2="200" y2="130" class="wire" marker-end="url(#arrow)"/>
  <text x="230" y="108" class="sub" text-anchor="middle">wr</text>
  <text x="230" y="148" class="sub" text-anchor="middle">rd</text>

  <!-- nbody_accelerator top -->
  <rect x="450" y="60" width="470" height="580" rx="8" class="core"/>
  <text x="685" y="85" class="lbl" text-anchor="middle" font-weight="bold">nbody_accelerator (top)</text>

  <line x1="400" y1="115" x2="450" y2="115" class="wire"/>
  <text x="425" y="108" class="sub" text-anchor="middle">reg</text>
  <text x="425" y="128" class="sub" text-anchor="middle">R/W</text>

  <!-- Register bank -->
  <rect x="475" y="105" width="420" height="72" rx="6" class="unit"/>
  <text x="685" y="128" class="lbl" text-anchor="middle">Control / Status Registers</text>
  <text x="685" y="146" class="sub" text-anchor="middle">0x000 CONTROL(start) · 0x008 STATUS(busy,done)</text>
  <text x="685" y="161" class="sub" text-anchor="middle">0x010 DT (float64) · 0x018 N_ITER</text>

  <!-- body_regfile -->
  <rect x="475" y="197" width="420" height="82" rx="6" class="unit"/>
  <text x="685" y="222" class="lbl" text-anchor="middle">body_regfile</text>
  <text x="685" y="240" class="sub" text-anchor="middle">5 bodies x (pos.xyz, vel.xyz, mass) = 35 x 64-bit float64 words (280B)</text>
  <text x="685" y="256" class="sub" text-anchor="middle">host port (MMIO 0x040-0x150)  |  core port (r/w during run)</text>

  <line x1="685" y1="177" x2="685" y2="197" class="wire"/>

  <!-- nbody_core -->
  <rect x="475" y="299" width="420" height="325" rx="6" class="unit"/>
  <text x="685" y="322" class="lbl" text-anchor="middle" font-weight="bold">nbody_core (21-state FSM + datapath)</text>

  <line x1="685" y1="279" x2="685" y2="299" class="wire"/>

  <rect x="495" y="338" width="150" height="42" rx="4" class="box"/>
  <text x="570" y="360" class="sub" text-anchor="middle">pair_rom</text>
  <text x="570" y="373" class="sub" text-anchor="middle">10 fixed (i,j) pairs</text>

  <rect x="665" y="338" width="230" height="42" rx="4" class="box"/>
  <text x="780" y="360" class="sub" text-anchor="middle">Sequencer</text>
  <text x="780" y="373" class="sub" text-anchor="middle">pair_idx, sub, pos_step, iter_cnt</text>

  <line x1="570" y1="380" x2="570" y2="400" class="wire"/>
  <line x1="780" y1="380" x2="780" y2="400" class="wire"/>

  <rect x="495" y="400" width="400" height="34" rx="4" class="box"/>
  <text x="695" y="422" class="sub" text-anchor="middle">S_LOAD_I / S_LOAD_J -- read 7 fields x2 bodies (14 cyc)</text>

  <line x1="695" y1="434" x2="695" y2="452" class="wire"/>

  <!-- shared math units row -->
  <rect x="495" y="452" width="130" height="66" rx="4" class="math"/>
  <text x="560" y="470" class="sub" text-anchor="middle" font-weight="bold">fp_add</text>
  <text x="560" y="484" class="sub2" text-anchor="middle">combinational</text>
  <text x="560" y="497" class="sub2" text-anchor="middle">align+renorm</text>
  <text x="560" y="510" class="sub2" text-anchor="middle">dx/dy/dz, sums</text>

  <rect x="635" y="452" width="120" height="66" rx="4" class="math"/>
  <text x="695" y="470" class="sub" text-anchor="middle" font-weight="bold">fp_mul</text>
  <text x="695" y="484" class="sub2" text-anchor="middle">combinational</text>
  <text x="695" y="497" class="sub2" text-anchor="middle">squares,</text>
  <text x="695" y="510" class="sub2" text-anchor="middle">mass scale</text>

  <rect x="765" y="452" width="125" height="66" rx="4" class="math"/>
  <text x="827" y="470" class="sub" text-anchor="middle" font-weight="bold">fp_sqrt</text>
  <text x="827" y="484" class="sub2" text-anchor="middle">iterative</text>
  <text x="827" y="497" class="sub2" text-anchor="middle">54 cycles</text>
  <text x="827" y="510" class="sub2" text-anchor="middle">sqrt(d2)</text>

  <rect x="495" y="528" width="180" height="38" rx="4" class="math"/>
  <text x="585" y="551" class="sub" text-anchor="middle" font-weight="bold">fp_div -- iterative, 55 cycles</text>

  <text x="590" y="522" class="sub2" text-anchor="middle">shared across all 10 pairs (one instance of each unit, time-multiplexed)</text>

  <line x1="685" y1="566" x2="685" y2="584" class="wire"/>

  <rect x="495" y="584" width="400" height="34" rx="4" class="box"/>
  <text x="695" y="606" class="sub" text-anchor="middle">S_VELUPD, S_WB_I/J -- update + write back 6 velocities</text>

  <line x1="895" y1="365" x2="915" y2="365" class="wire"/>
  <line x1="915" y1="365" x2="915" y2="610" class="wire" stroke-dasharray="4,3"/>
  <line x1="915" y1="610" x2="895" y2="610" class="wire" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="928" y="490" class="sub2" fill="#a33" transform="rotate(90 928 490)" text-anchor="middle">loop 10 pairs</text>

  <line x1="685" y1="618" x2="685" y2="299" class="wire" stroke-dasharray="4,3"/>
  <text x="360" y="640" class="sub" fill="#a33">S_POSUPD (5 bodies) then S_LOAD_I for next iteration -- loop N=20,000x</text>

  <!-- IRQ -->
  <line x1="450" y1="100" x2="200" y2="100" class="wire"/>
  <text x="320" y="90" class="sub" text-anchor="middle">irq (done)</text>

</svg>
